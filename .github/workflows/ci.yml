name: Continuous Integration
run-name: CI - ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches:
      - main

# This repository is public: run on GitHub-hosted runners only, never on self-hosted ones.

# A new push makes the previous run of the same PR obsolete
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-quality-check:
    name: Code quality check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      # Runs .pre-commit-config.yaml: shellcheck, zizmor, manifest validation, and file hygiene checks
      - name: Run pre-commit checks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  hook-tests:
    name: Hook tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          # Plain bats only: no helper library is used
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run hook tests
        run: bats tests/
