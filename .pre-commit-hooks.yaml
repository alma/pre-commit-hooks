- id: uv-lock-script
  name: Lock PEP 723 scripts
  description: >
    Generate the <script>.py.lock lock file of every Python script with PEP 723
    inline metadata. Fails when a lock file is stale or missing. Requires uv.
  entry: hooks/uv-lock-script.sh
  language: script
  files: \.py(\.lock)?$
  # foo.py and foo.py.lock must not be locked by two parallel batches
  require_serial: true
